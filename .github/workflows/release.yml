name: Release

# Publishes to PyPI when a version tag is pushed (e.g. `git tag v0.1.0 && git push --tags`).
#
# The version is NOT stored in pyproject.toml — hatch-vcs derives it from the
# tag (see [tool.hatch.version]). The tag is therefore the only place a release
# number is decided, which is what makes the assertion below meaningful rather
# than circular: it re-derives from the built artifact and compares.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token is stored in the repo,
# matching willow-mcp. One-time setup before the first release:
#   1. On PyPI: add a *pending publisher* for project `jeles`, this repo,
#      workflow `release.yml`, environment `pypi`. (Pending, because the project
#      does not exist on PyPI until the first upload.)
#   2. Create a GitHub environment named `pypi` (Settings -> Environments).
# Until that is configured, this workflow is inert — nothing publishes without a tag.
#
# Two triggers, one path:
#   * `release: published` — the automated route. release-please merges its
#     "chore: release X.Y.Z" PR, creates the tag AND a GitHub Release, and the
#     Release fires this. It has to be the Release rather than the tag: a tag
#     pushed by GITHUB_TOKEN does not trigger other workflows (GitHub's
#     recursion guard).
#
#     THAT DOES NOT WORK, and v0.2.0 proved it: release-please created the tag
#     and published the Release, and this workflow did not run. The guard is not
#     specific to `push` — GitHub suppresses workflow runs for *any* event
#     generated with GITHUB_TOKEN, `release: published` included. The trigger is
#     kept because it costs nothing and does fire for a Release published by a
#     human or a PAT-backed action, but it is not the automated path.
#   * `workflow_call` — THE automated path. release-please.yml calls this
#     workflow directly once it has cut a release. A workflow cannot be started
#     by a bot-generated event, but it can be *called*, which avoids the guard
#     rather than trying to work around it. One publishing implementation, used
#     by every path.
#   * `push: tags` — a human running `git push origin vX.Y.Z`. Works, and is
#     still the right move when you want to ship without a release PR.
#   * `workflow_dispatch` — publish an existing tag from the Actions UI. This is
#     the recovery path when a tag exists but nothing published, which is
#     exactly where v0.2.0 landed. Also just a convenient release button.
#
# `skip-existing` on the publish step makes any double-run a no-op rather than
# a red X, whichever trigger started it.

on:
  # Called by release-please.yml once it has cut a release. This is the
  # automated path: release-please cannot trigger this workflow by creating a
  # tag or a Release (GITHUB_TOKEN events are suppressed), but it CAN call it
  # directly, which sidesteps the guard entirely instead of working around it.
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and publish"
        required: true
        type: string
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # One name for the tag across all three triggers, in priority order: the
      # dispatch input, then the Release's own tag_name, then the pushed ref.
      # Deriving it once here keeps the assertion below honest whichever way the
      # run started. On workflow_dispatch github.ref_name is the *branch*, so
      # the input has to win or the assertion would compare against "master".
      TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the tag itself, not the branch head it may sit behind.
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          # hatch-vcs derives the version from the git tag, so the tags must be
          # present. The default shallow checkout fetches none of them.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Assert the tag matches the built version
        # kartikeya shipped a v0.0.8 tag whose build produced 0.0.7, and the only
        # thing that caught it was PyPI refusing the duplicate upload. Fail here
        # instead, where the error says what is actually wrong.
        run: |
          tag="${TAG#v}"
          built="$(ls dist/*.tar.gz | sed -E 's|.*/jeles-(.+)\.tar\.gz|\1|')"
          echo "tag=${tag}  built=${built}"
          if [ "$tag" != "$built" ]; then
            echo "::error::tag v${tag} builds version ${built} — refusing to publish"
            exit 1
          fi

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

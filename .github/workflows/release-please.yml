name: Release Please

# Keeps an open "chore: release X.Y.Z" pull request that accumulates every
# merge to master — bumping the proposed version from conventional-commit
# prefixes and appending the CHANGELOG entry. Nothing publishes while it sits
# there. Merging that PR creates the tag AND a GitHub Release, and the Release
# is what fires `release.yml`.
#
# CAVEAT — the last hop is NOT automatic yet. GitHub suppresses workflow runs
# for any event generated with GITHUB_TOKEN, and that covers `release:
# published`, not just `push: tags`. So merging the release PR creates the tag
# and the Release, and `release.yml` does not run. v0.2.0 landed exactly there:
# tagged, released, absent from PyPI.
#
# Until that is resolved, publish with `release.yml`'s workflow_dispatch, giving
# it the tag release-please created. The two durable fixes are (a) run the build
# and publish steps here, gated on this action's `release_created` output, which
# needs a second PyPI trusted publisher registered against THIS filename, or
# (b) give this action a PAT instead of GITHUB_TOKEN, after which the tag push
# and the Release both trigger workflows normally.
#
# The version itself is not stored anywhere — hatch-vcs derives it from the tag
# (see [tool.hatch.version]). That is why `release-type: simple` is correct
# here: it maintains the changelog and the tag and edits no version file, so
# there is no second copy to drift.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never cancel a run that may be cutting a release

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

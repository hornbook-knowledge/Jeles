name: Release Please

# Keeps an open "chore: release X.Y.Z" pull request that accumulates every
# merge to master — bumping the proposed version from conventional-commit
# prefixes and appending the CHANGELOG entry. Nothing publishes while it sits
# there. Merging that PR creates the tag AND a GitHub Release, and the Release
# is what fires `release.yml`.
#
# Publishing is NOT triggered by the tag or the Release. GitHub suppresses
# workflow runs for any event generated with GITHUB_TOKEN — `release: published`
# included, not just `push: tags` — so a workflow waiting on either would
# silently never run. v0.2.0 proved it: tagged, released, absent from PyPI.
#
# So this workflow *calls* release.yml instead of hoping to trigger it. A bot
# event cannot start a workflow, but a job can call one, which sidesteps the
# guard rather than working around it — and keeps a single publishing
# implementation shared by the automated, manual and recovery paths.
#
# The version itself is not stored anywhere — hatch-vcs derives it from the tag
# (see [tool.hatch.version]). That is why `release-type: simple` is correct
# here: it maintains the changelog and the tag and edits no version file, so
# there is no second copy to drift.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never cancel a run that may be cutting a release

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Only after the release PR is merged and a release actually exists. On every
  # other push to master release_created is false and this is skipped, so
  # ordinary merges still publish nothing.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: read
      id-token: write   # Trusted Publishing; must be granted by the CALLER too

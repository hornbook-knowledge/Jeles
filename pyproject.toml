[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "jeles"
# The git tag is the single source of truth — see [tool.hatch.version]. The
# version is deliberately not a literal here: kartikeya shipped a v0.0.8 tag
# whose build produced 0.0.7 because a literal in this file went unbumped, and
# willow-mcp's literal sat frozen 251 commits past its own release.
dynamic = ["version"]
description = "Jeles' verified-nugget corpus organ: pure SOIL-backed storage/ranking, a standalone MCP server, best-effort fleet gap-forwarding, and the canonical Jeles persona."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Sean Campbell" }]
requires-python = ">=3.10"
keywords = ["mcp", "corpus", "verified-answers", "citations", "librarian", "retrieval", "willow", "jeles"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Topic :: Text Processing :: Indexing",
]
# Zero runtime dependencies, on purpose. corpus.py, the persona, and the
# reactions (including search_adapter's urllib egress) are stdlib-only, and
# tests/test_import_purity.py enforces it. That is what lets a host — willow-mcp
# above all — depend on `jeles` without inheriting a version constraint: pinning
# mcp here made `pip install willow-mcp jeles` unresolvable, because willow-mcp
# requires mcp>=2 while this package required mcp<2.
dependencies = []

[project.optional-dependencies]
# Only corpus_server.py (top-level import) and willow_mcp_client.py (lazy,
# inside a function) need the MCP SDK.
#
# SDK 2.x: `mcp.server.fastmcp` was removed in 2.0 and corpus_server now uses
# `mcp.server.mcpserver.MCPServer`. The floor is >=2.0 rather than a permissive
# range because there is no shim — 1.x has no `mcp.server.mcpserver` at all, so
# a range spanning both majors would install a broken combination half the time.
# This is the same floor willow-mcp requires, so `jeles[mcp]` and willow-mcp
# now co-install.
mcp = ["mcp>=2.0.0,<3.0.0"]
# pyyaml is for tests/test_release_wiring.py, which reads the release
# workflows. It importorskips, so leaving it out would turn those checks
# into a silent skip — the exact failure mode they exist to catch. It is a
# dev extra, so the zero-runtime-dependency promise is untouched.
dev = ["pytest>=8.0", "pyyaml", "tomli; python_version<'3.11'", "jeles[mcp]"]

[project.scripts]
jeles-corpus-mcp = "jeles.corpus_server:main"

[project.urls]
Homepage = "https://github.com/rudi193-cmd/Jeles"
Repository = "https://github.com/rudi193-cmd/Jeles"
Issues = "https://github.com/rudi193-cmd/Jeles/issues"

[tool.hatch.version]
# Derived from the git tag (hatch-vcs). At an exact tag `vX.Y.Z` the version is
# X.Y.Z; off-tag builds get a `.devN+g<sha>` suffix PyPI rejects, so a publish
# from an untagged commit fails loudly instead of shipping something
# mislabelled. CI must check out with `fetch-depth: 0` or no tags are present.
#
# This package has never been published and carries no tags yet, so the first
# tag pushed decides the first released version — and PyPI never lets a version
# be reused. Pick it deliberately.
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["jeles"]

[tool.ruff]
# 100, not ruff's default 88. Every hand-maintained file in this tree already
# fits under it (measured: 0 violations outside `jeles/sources.py`), so it is a
# real bound on new code rather than a number picked to make the linter quiet.
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# CI enforced ruff with no config at all, which meant ruff's defaults: E4, E7,
# E9 and F. That is pyflakes plus a handful of syntax-adjacent checks — no line
# length, no import ordering, no bugbear. It also silently made every
# `# noqa: E402` and `# noqa: E731` in the tree a dead directive suppressing a
# rule that was never on, which is the same shape as the bugs this repo keeps
# finding: a comment asserting a protection that is not running. RUF100 catches
# exactly that, and is the reason it is in this list.
select = [
    "E", "W",   # pycodestyle — including E501, which the defaults leave off
    "F",        # pyflakes
    "I",        # import ordering
    "B",        # bugbear: mutable defaults, zip() without strict, unused loop vars
    "C4",       # comprehension shape
    "UP",       # py310+ idiom (matches target-version, so it cannot drift)
    "SIM",      # a few real ones — an unclosed file handle, a Yoda comparison
    "RUF",      # ruff's own, incl. RUF100 (dead noqa)
]

[tool.ruff.lint.per-file-ignores]
# `jeles/sources.py` is vendored: ~60 thin adapters over external APIs, ported
# rather than written here, and not hand-edited except at the fan-out. 71 of its
# lines exceed 100 — long f-string snippet assembly and XML namespace lookups,
# not URLs (only 3 are). Reflowing them is mechanical churn on code we did not
# write, for no reading benefit, and leaving E501 on would put 71 permanent
# warnings in front of every real finding. Every other rule above still applies
# to it. Revisit if this file ever becomes hand-maintained.
"jeles/sources.py" = ["E501"]
